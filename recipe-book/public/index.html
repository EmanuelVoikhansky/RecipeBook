<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/spicy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Example React + GraphQL app implementing a social cookbook app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/spicy.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- copied from node_modules by scripts/copy-pico.js -->
    <link rel="stylesheet" href="%PUBLIC_URL%/pico.min.css" />
    <title>Cookbook</title>
    <script>
      // Apply a saved light/dark choice before first paint so the page doesn't
      // flash the wrong theme. Without one, Pico follows the OS setting.
      try {
        var savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
