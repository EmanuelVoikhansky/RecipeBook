<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img" aria-labelledby="title desc">
<title id="title">NestJS request lifecycle for saveRecipe, compared to Java EE</title>
<desc id="desc">Once per HTTP request: express-session middleware (like a Servlet filter), then Apollo Server parses and validates (like the GraphQL servlet). Once per resolver call: Guards (LoginGuard, like a NameBinding request filter), Interceptors (unused, like AroundInvoke), Pipes (unused, like Bean Validation), the resolver method (like a GraphQLApi method), and exception filters on error (unused, like ExceptionMapper).</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; dominant-baseline: central; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .mid { text-anchor: middle; }
  rect.n { stroke-width: 0.75; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .plain rect { fill: #FFFFFF; stroke: #B4B2A9; } .plain .th { fill: #2C2C2A; } .plain .ts { fill: #5F5E5A; }
  .unused rect { fill: #FFFFFF; stroke: #888780; stroke-dasharray: 5 4; } .unused .th { fill: #5F5E5A; } .unused .ts { fill: #888780; }
  .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
  .frame { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 6 4; }
  .label { fill: #2C2C2A; } .note { fill: #5F5E5A; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="740" rx="12" fill="#FFFFFF"/>

<rect class="frame" x="40" y="20" width="600" height="194" rx="16"/>
<text class="th label" x="60" y="40">Once per HTTP request</text>

<g class="purple"><rect class="n" x="60" y="58" width="270" height="56" rx="8"/>
<text class="th mid" x="195" y="76">Middleware</text><text class="ts mid" x="195" y="94">express-session loads req.session</text></g>
<g class="plain"><rect class="n" x="370" y="58" width="250" height="56" rx="8"/>
<text class="th mid" x="495" y="76">Servlet filter</text><text class="ts mid" x="495" y="94">web.xml / @WebFilter chain</text></g>
<line class="arr" x1="195" y1="114" x2="195" y2="136" marker-end="url(#a)"/>

<g class="gray"><rect class="n" x="60" y="138" width="270" height="56" rx="8"/>
<text class="th mid" x="195" y="156">Apollo Server</text><text class="ts mid" x="195" y="174">parse, validate, execute</text></g>
<g class="plain"><rect class="n" x="370" y="138" width="250" height="56" rx="8"/>
<text class="th mid" x="495" y="156">GraphQL servlet</text><text class="ts mid" x="495" y="174">graphql-java behind SPQR</text></g>
<line class="arr" x1="195" y1="194" x2="195" y2="274" marker-end="url(#a)"/>

<rect class="frame" x="40" y="238" width="600" height="434" rx="16"/>
<text class="th label" x="215" y="258">Once per resolver call (each root field)</text>

<g class="purple"><rect class="n" x="60" y="276" width="270" height="56" rx="8"/>
<text class="th mid" x="195" y="294">Guards</text><text class="ts mid" x="195" y="312">LoginGuard may veto the call</text></g>
<g class="plain"><rect class="n" x="370" y="276" width="250" height="56" rx="8"/>
<text class="th mid" x="495" y="294">@NameBinding filter</text><text class="ts mid" x="495" y="312">binds by annotation, can abort</text></g>
<line class="arr" x1="195" y1="332" x2="195" y2="354" marker-end="url(#a)"/>

<g class="unused"><rect class="n" x="60" y="356" width="270" height="56" rx="8"/>
<text class="th mid" x="195" y="374">Interceptors</text><text class="ts mid" x="195" y="392">not used here</text></g>
<g class="plain"><rect class="n" x="370" y="356" width="250" height="56" rx="8"/>
<text class="th mid" x="495" y="374">@AroundInvoke</text><text class="ts mid" x="495" y="392">CDI interceptor, wraps the call</text></g>
<line class="arr" x1="195" y1="412" x2="195" y2="434" marker-end="url(#a)"/>

<g class="unused"><rect class="n" x="60" y="436" width="270" height="56" rx="8"/>
<text class="th mid" x="195" y="454">Pipes</text><text class="ts mid" x="195" y="472">not used here</text></g>
<g class="plain"><rect class="n" x="370" y="436" width="250" height="56" rx="8"/>
<text class="th mid" x="495" y="454">Bean Validation</text><text class="ts mid" x="495" y="472">plus JAX-RS ParamConverter</text></g>
<line class="arr" x1="195" y1="492" x2="195" y2="514" marker-end="url(#a)"/>

<g class="purple"><rect class="n" x="60" y="516" width="270" height="56" rx="8"/>
<text class="th mid" x="195" y="534">Resolver method</text><text class="ts mid" x="195" y="552">RecipeResolver.saveRecipe()</text></g>
<g class="plain"><rect class="n" x="370" y="516" width="250" height="56" rx="8"/>
<text class="th mid" x="495" y="534">@GraphQLApi method</text><text class="ts mid" x="495" y="552">MicroProfile GraphQL</text></g>
<line class="arr" x1="195" y1="572" x2="195" y2="594" marker-end="url(#a)" stroke-dasharray="4 3"/>

<g class="unused"><rect class="n" x="60" y="596" width="270" height="56" rx="8"/>
<text class="th mid" x="195" y="614">Exception filters</text><text class="ts mid" x="195" y="632">not used; errors pass through</text></g>
<g class="plain"><rect class="n" x="370" y="596" width="250" height="56" rx="8"/>
<text class="th mid" x="495" y="614">ExceptionMapper</text><text class="ts mid" x="495" y="632">JAX-RS error translation</text></g>

<g class="purple"><rect class="n" x="40" y="692" width="12" height="12" rx="2"/></g>
<text class="ts note" x="60" y="698">Used in this app</text>
<g class="unused"><rect class="n" x="200" y="692" width="12" height="12" rx="2" style="stroke-dasharray:3 2"/></g>
<text class="ts note" x="220" y="698">Available, not used here</text>
<g class="gray"><rect class="n" x="420" y="692" width="12" height="12" rx="2"/></g>
<text class="ts note" x="440" y="698">Framework</text>
<text class="ts note" x="40" y="722">Right column: closest Java EE counterpart · dashed arrow: only when an error is thrown</text>
</svg>
