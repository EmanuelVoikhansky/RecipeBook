<line class="arr" x1="340" y1="86" x2="340" y2="118" marker-end="url(#a)"/>

<g class="gray"><rect class="n" x="40" y="120" width="600" height="56" rx="8"/>
<text class="th mid" x="340" y="138">express-session middleware (main.ts)</text>
<text class="ts mid" x="340" y="156">≈ Servlet filter chain · plain Express, outside DI</text></g>

