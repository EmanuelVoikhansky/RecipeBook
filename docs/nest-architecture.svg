<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" role="img" aria-labelledby="title desc">
<title id="title">RecipeBook NestJS backend architecture with Java EE counterparts</title>
<desc id="desc">Clients reach express-session middleware registered in main.ts, then AppModule. Inside AppModule, GraphQLModule (Apollo Server 5) routes calls to RecipeResolver, gated by LoginGuard. RecipeResolver uses the request-scoped ViewerContext and TypeORM repositories; DevDataSeeder also uses the repositories. State lives in an in-memory session store and in-memory SQLite. Each box notes its closest Java EE counterpart.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; dominant-baseline: central; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .mid { text-anchor: middle; }
  rect.n { stroke-width: 0.75; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .plain rect { fill: #FFFFFF; stroke: #B4B2A9; } .plain .th { fill: #2C2C2A; } .plain .ts { fill: #5F5E5A; }
  .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
  .frame { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 6 4; }
  .label { fill: #2C2C2A; } .note { fill: #5F5E5A; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="690" rx="12" fill="#FFFFFF"/>

