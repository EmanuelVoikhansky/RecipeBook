<text class="ts note" x="60" y="240">≈ bean archive, explicit list</text>
<line class="arr" x1="340" y1="176" x2="340" y2="260" marker-end="url(#a)"/>

<g class="gray"><rect class="n" x="60" y="262" width="560" height="56" rx="8"/>
<text class="th mid" x="340" y="280">GraphQLModule · Apollo Server 5</text>
<text class="ts mid" x="340" y="298">≈ GraphQL servlet · schema built from decorators</text></g>
<line class="arr" x1="340" y1="318" x2="340" y2="356" marker-end="url(#a)"/>

