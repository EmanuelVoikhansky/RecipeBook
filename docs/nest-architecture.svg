<text class="th mid" x="180" y="578">Session MemoryStore</text><text class="ts mid" x="180" y="596">token + userId per session</text></g>
<g class="teal"><rect class="n" x="340" y="560" width="280" height="56" rx="8"/>
<text class="th mid" x="480" y="578">SQLite in memory (sql.js)</text><text class="ts mid" x="480" y="596">≈ in-memory H2, seeded on boot</text></g>

<g class="purple"><rect class="n" x="40" y="638" width="12" height="12" rx="2"/></g>
<text class="ts note" x="60" y="644">Nest provider (DI-managed)</text>
<g class="gray"><rect class="n" x="270" y="638" width="12" height="12" rx="2"/></g>
<text class="ts note" x="290" y="644">Framework / Express</text>
